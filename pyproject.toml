[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyara"
version = "0.1.0"
description = "Measure, correct and improve Hausa speech-to-text on N-ATLAS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gyara team" }]
keywords = ["hausa", "asr", "speech-to-text", "n-atlas", "whisper", "nigeria", "wer"]
dependencies = [
  "numpy>=1.24,<2.3",
  "jiwer>=3.0",          # brings rapidfuzz, used for alignment
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Transcription and evaluation with a speech model.
asr = [
  "torch>=2.2",
  "transformers>=4.44,<5",
  "accelerate>=0.30",
  "silero-vad>=5.1",
  "librosa>=0.10",
  "imageio-ffmpeg>=0.5",  # ffmpeg binary for mp3/m4a/mp4 without a system install
]
# Dataset export, FLEURS download and fine-tuning.
train = [
  "gyara[asr]",
  "datasets>=2.20,<4",
  "evaluate>=0.4",
]
# The correction web app.
ui = ["gyara[asr]", "gradio>=4.40,<6"]
# N-ATLaS suggestions on a local GPU (4-bit). Linux + CUDA for bitsandbytes.
llm = ["gyara[asr]", "bitsandbytes>=0.43; platform_system == 'Linux'", "httpx>=0.27"]
all = ["gyara[asr,train,ui,llm]"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gyara = "gyara.cli:app"

[tool.setuptools.packages.find]
include = ["gyara*"]

[tool.setuptools.package-data]
gyara = ["data/*.yaml", "finetune/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a model or dataset; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
